name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project Cutaway.xcodeproj -scheme Cutaway
          -configuration Release -derivedDataPath .build build
          CODE_SIGNING_ALLOWED=NO
