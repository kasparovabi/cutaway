name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project Cutaway.xcodeproj -scheme Cutaway
          -configuration Release -derivedDataPath .build build
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=-
      - run: ditto -c -k --keepParent .build/Build/Products/Release/Cutaway.app "Cutaway-${GITHUB_REF_NAME#v}.zip"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "Cutaway-${GITHUB_REF_NAME#v}.zip"
          --title "Cutaway ${GITHUB_REF_NAME#v}" --generate-notes
